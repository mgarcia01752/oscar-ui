name: Experimental macOS package
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml
  macos:
    needs: security
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.10+7.0.LTS'
          architecture: aarch64
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Bootstrap OSCAR
        run: bash scripts/unix/bootstrap-oscar.sh
      - name: Set up Qt for macOS
        run: bash scripts/macos/setup-qt.sh
      - name: Build and verify experimental DMG
        run: python3 scripts/build/build-image.py --macos
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-package-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        with:
          name: macos-release
          path: dist/macos/release/*.dmg
          if-no-files-found: error
