name: OSCAR-UI CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: oscar-ui-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Bootstrap pinned Oscar release
        run: ./scripts/unix/bootstrap-oscar.sh
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build for CodeQL
        run: ./mvnw -B "-Dmaven.repo.local=$PWD/.m2" -DskipTests clean package
      - name: Analyze and upload results
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  build:
    needs: security
    name: Java 21 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check source license headers
        run: python3 tools/development/check-license-headers.py
      - name: Test release tooling
        run: |
          python3 -m unittest discover -s tools/git -p 'test_*.py'
          python3 -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s tools/development -p 'test_*.py'
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Bootstrap pinned Oscar release
        run: ./scripts/unix/bootstrap-oscar.sh
      - name: Build JAR and run Java tests
        run: ./mvnw -B "-Dmaven.repo.local=$PWD/.m2" clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: java-test-reports-${{ matrix.os }}
          path: target/surefire-reports/
          if-no-files-found: warn

  windows:
    needs: security
    name: Java 21 / Windows 11 ARM (x64 emulation)
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check source license headers
        run: python tools/development/check-license-headers.py
      - name: Test dependency updater
        run: python -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s tools/development -p 'test_*.py'
      - name: Test Windows packaging helpers
        run: python -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s scripts/tests -p 'test_windows_*.py'
      - name: Bootstrap pinned Oscar release
        run: ./scripts/windows/bootstrap-oscar.ps1
      - name: Build JAR and run Java tests
        run: ./mvnw.cmd -B "-Dmaven.repo.local=$PWD/.m2" clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: java-test-reports-windows-11-arm
          path: target/surefire-reports/
          if-no-files-found: warn
