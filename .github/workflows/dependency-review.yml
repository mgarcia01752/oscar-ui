name: Dependency review
on:
  pull_request:
    paths:
      - '**/pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - 'install.sh'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'scripts/unix/bootstrap-oscar.sh'
      - 'scripts/windows/bootstrap-oscar.ps1'
      - 'scripts/unix/setup-qt.sh'
      - 'scripts/windows/setup-qt.ps1'
      - 'scripts/build/collect-release-sources.py'
      - 'scripts/build/desktop.py'
      - 'tools/development/update-oscar.py'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
