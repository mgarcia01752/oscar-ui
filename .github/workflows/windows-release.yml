name: Windows release
on:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Use Adoptium's full SemVer, including its LTS build suffix.
          java-version: '21.0.10+7.0.LTS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure WiX 3 tools
        shell: pwsh
        run: |
          $WixBin = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14/bin'
          if (!(Test-Path "$WixBin/candle.exe") -or !(Test-Path "$WixBin/light.exe")) {
            choco install wixtoolset --version=3.14.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          }
          if (!(Test-Path "$WixBin/candle.exe") -or !(Test-Path "$WixBin/light.exe")) {
            throw 'WiX 3 compiler/linker missing'
          }
          $WixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install pinned Oscar
        shell: pwsh
        run: ./scripts/bootstrap-oscar.ps1
      - name: Install pinned Qt
        shell: pwsh
        run: ./scripts/setup-qt.ps1
      - name: Build MSI and test application image
        shell: pwsh
        run: ./scripts/windows-release.ps1
      - name: Verify MSI install, launch, and uninstall
        shell: pwsh
        run: ./scripts/test-windows-install.ps1
      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-logs
          path: target/installer-logs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/windows/release/*.msi
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    concurrency:
      group: publish-desktop-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Attach application to the shared draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "OSCAR-UI $RELEASE_TAG" \
              --notes-file packaging/release-notes.md
          fi
          assets=(release/*.msi)
          test "${#assets[@]}" -eq 1
          test -f "${assets[0]}"
          gh release upload "$RELEASE_TAG" "${assets[0]}" --clobber
