name: Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Use Adoptium's full SemVer, including its LTS build suffix.
          java-version: '21.0.10+7.0.LTS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Oscar
        shell: pwsh
        run: ./scripts/bootstrap-oscar.ps1
      - name: Install pinned Qt
        shell: pwsh
        run: ./scripts/setup-qt.ps1
      - name: Build and test portable application
        shell: pwsh
        run: ./scripts/windows-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/windows/release/*.zip
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    concurrency:
      group: publish-desktop-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Attach application to the shared draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "OSCAR-UI $RELEASE_TAG" \
              --notes 'Windows: download the Windows ZIP, extract it, and run OSCAR-UI.exe. Ubuntu: download the DEB and install with sudo apt install ./oscar-ui_*.deb. Java and Qt are included. Dependency sources and their checksums are inside each package. GitHub Source code downloads are for developers.'
          fi
          assets=(release/*.zip)
          test "${#assets[@]}" -eq 1
          test -f "${assets[0]}"
          gh release upload "$RELEASE_TAG" "${assets[0]}" --clobber
