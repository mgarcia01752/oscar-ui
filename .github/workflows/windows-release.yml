name: Windows release
on:
  workflow_call:
    inputs:
      patch_prototype:
        type: boolean
        default: false
        description: Run isolated synthetic patch tests; never publish this build
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Use Adoptium's full SemVer, including its LTS build suffix.
          java-version: '21.0.10+7.0.LTS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test dependency updater
        shell: pwsh
        run: python -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s tools/development -p 'test_*.py'
      - name: Test Windows packaging helpers
        shell: pwsh
        run: python -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s scripts/tests -p 'test_windows_*.py'
      - name: Test installed Windows updater validation
        shell: powershell
        run: ./scripts/windows/test-windows-update-helper.ps1
      - name: Configure WiX 3 tools
        shell: pwsh
        run: |
          $WixBin = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14/bin'
          if (!(Test-Path "$WixBin/candle.exe") -or !(Test-Path "$WixBin/light.exe")) {
            choco install wixtoolset --version=3.14.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          }
          if (!(Test-Path "$WixBin/candle.exe") -or !(Test-Path "$WixBin/light.exe")) {
            throw 'WiX 3 compiler/linker missing'
          }
          $WixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install pinned Oscar
        shell: pwsh
        run: ./scripts/windows/bootstrap-oscar.ps1
      - name: Install pinned Qt
        shell: pwsh
        run: ./scripts/windows/setup-qt.ps1
      - name: Build MSI and test application image
        shell: pwsh
        run: ./scripts/windows/windows-release.ps1
      - name: Verify MSI install, launch, and uninstall
        shell: pwsh
        run: ./scripts/windows/test-windows-install.ps1
      - name: Test isolated Windows patch prototype
        if: inputs.patch_prototype
        shell: pwsh
        run: ./scripts/windows/test-windows-patch.ps1
      - name: Retain patch prototype evidence
        if: always() && inputs.patch_prototype
        uses: actions/upload-artifact@v4
        with:
          name: windows-patch-prototype-NOT-FOR-RELEASE
          path: dist/windows/patch-prototype/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-logs
          path: target/installer-logs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/windows/release/*
          if-no-files-found: error
  publish:
    if: ${{ !inputs.patch_prototype && startsWith(github.ref, 'refs/tags/') }}
    needs: windows
    runs-on: ubuntu-latest
    concurrency:
      group: publish-desktop-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Attach application to the shared draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "OSCAR-UI $RELEASE_TAG" \
              --notes-file packaging/release-notes.md
          fi
          shopt -s nullglob
          installers=(release/*.msi)
          test "${#installers[@]}" -eq 1
          test -s release/windows-update.json
          test -s release/windows-patch-inputs.zip
          assets=(release/*.msi release/*.msp release/windows-update.json release/windows-patch-inputs.zip)
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
