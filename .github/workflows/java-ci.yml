name: Java CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Java 21 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source license headers
        run: python3 tools/development/check-license-headers.py
      - name: Test release tooling
        run: |
          python3 -m unittest discover -s tools/git -p 'test_*.py'
          python3 -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s tools/development -p 'test_*.py'
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Bootstrap pinned Oscar release
        run: ./scripts/unix/bootstrap-oscar.sh
      - name: Build JAR and run Java tests
        run: ./mvnw -B "-Dmaven.repo.local=$PWD/.m2" clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports-${{ matrix.os }}
          path: target/surefire-reports/
          if-no-files-found: warn
