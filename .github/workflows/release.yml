name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security:
    name: Validate release security
    permissions:
      contents: write
      security-events: write
      actions: read
    uses: ./.github/workflows/security.yml
    if: startsWith(github.ref, 'refs/tags/v')
  ci:
    name: Validate tagged commit
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/java-ci.yml
  windows:
    name: Windows package
    needs: [ci, security]
    permissions:
      contents: write
    uses: ./.github/workflows/windows-release.yml
  ubuntu:
    name: Ubuntu package
    needs: [ci, security]
    permissions:
      contents: write
    uses: ./.github/workflows/ubuntu-release.yml
  publish:
    name: Publish verified release
    needs: [windows, ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify both installers and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          gh release view "$RELEASE_TAG" --json assets > release-assets.json
          jq -e --arg msi "OSCAR-UI-${version}-windows-x64.msi" \
            --arg deb "oscar-ui_amd64.deb" '
            .assets as $assets |
            all([$msi, $deb][]; . as $name |
              any($assets[]; .name == $name and .state == "uploaded" and .size > 0))
          ' release-assets.json
          gh release edit "$RELEASE_TAG" --draft=false
