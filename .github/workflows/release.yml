name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    name: Validate tagged commit
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/java-ci.yml
  windows:
    name: Windows package
    needs: ci
    permissions:
      contents: write
    uses: ./.github/workflows/windows-release.yml
  ubuntu:
    name: Ubuntu package
    needs: ci
    permissions:
      contents: write
    uses: ./.github/workflows/ubuntu-release.yml
  publish:
    name: Publish verified release
    needs: [windows, ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify both installers and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # The tag endpoint does not resolve drafts. Find the draft's numeric ID.
          release_id=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          [[ "$release_id" =~ ^[0-9]+$ ]] || { echo "Expected one release for $RELEASE_TAG" >&2; exit 1; }
          gh api "repos/$GH_REPO/releases/$release_id" > release-assets.json
          jq -e --arg msi "OSCAR-UI-${version}-windows-x64.msi" \
            --arg deb "oscar-ui_amd64.deb" '
            .assets as $assets |
            all([$msi, $deb][]; . as $name |
              any($assets[]; .name == $name and .state == "uploaded" and .size > 0))
          ' release-assets.json
          gh release download "$RELEASE_TAG" --pattern windows-update.json --dir windows-metadata
          python3 scripts/build/verify-windows-release.py --version "$version" \
            --assets release-assets.json --manifest windows-metadata/windows-update.json
          gh release edit "$RELEASE_TAG" --draft=false
