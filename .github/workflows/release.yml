name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    permissions:
      contents: read
      security-events: write
    name: Validate tagged commit
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/oscar-ui-ci.yml
  windows-build:
    needs: ci
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      java-version: ${{ steps.java.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        id: java
        with:
          distribution: temurin
          # Use Adoptium's full SemVer, including its LTS build suffix.
          java-version: '21.0.10+7.0.LTS'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test dependency updater
        shell: pwsh
        run: python -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s tools/development -p 'test_*.py'
      - name: Test Windows packaging helpers
        shell: pwsh
        run: python -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s scripts/tests -p 'test_windows_*.py'
      - name: Test installed Windows updater validation
        shell: powershell
        run: ./scripts/windows/test-windows-update-helper.ps1
      - name: Configure WiX 3 tools
        shell: pwsh
        run: |
          $WixBin = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14/bin'
          if (!(Test-Path "$WixBin/candle.exe") -or !(Test-Path "$WixBin/light.exe")) {
            choco install wixtoolset --version=3.14.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          }
          if (!(Test-Path "$WixBin/candle.exe") -or !(Test-Path "$WixBin/light.exe")) {
            throw 'WiX 3 compiler/linker missing'
          }
          $WixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install pinned Oscar
        shell: pwsh
        run: ./scripts/windows/bootstrap-oscar.ps1
      - name: Install pinned Qt
        shell: pwsh
        run: ./scripts/windows/setup-qt.ps1
      - name: Build MSI and test application image
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/windows/windows-release.ps1
      - name: Verify MSI install, launch, and uninstall
        shell: pwsh
        run: ./scripts/windows/test-windows-install.ps1
      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer-logs
          path: target/installer-logs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: windows-release
          path: dist/windows/release/*
          if-no-files-found: error
  windows-install:
    name: MSI lifecycle / Windows 11 ARM (x64 emulation)
    needs: windows-build
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ needs.windows-build.outputs.java-version }}
          architecture: x64
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/download-artifact@v7
        with:
          name: windows-release
          path: dist/windows/release
      - name: Verify MSI install, launch, and uninstall
        run: ./scripts/windows/test-windows-install.ps1
      - name: Upload Windows 11 installer logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-11-arm-installer-logs
          path: target/installer-logs/
          if-no-files-found: ignore
  windows-upload:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [windows-build, windows-install, ubuntu-install, macos-build]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-desktop-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: windows-release
          path: release
      - name: Attach application to the shared draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "OSCAR-UI $RELEASE_TAG" \
              --notes-file packaging/release-notes.md
          fi
          shopt -s nullglob
          installers=(release/*.msi)
          test "${#installers[@]}" -eq 1
          test -s release/windows-update.json
          test -s release/windows-patch-inputs.zip
          assets=(release/*.msi release/*.msp release/windows-update.json release/windows-patch-inputs.zip)
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  ubuntu-build:
    needs: ci
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.10+7.0.LTS'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot libgl1 libegl1 libdbus-1-3 libfontconfig1 libfreetype6 libx11-xcb1 libxkbcommon0 libxkbcommon-x11-0 libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1 libxcb-render0
      - name: Bootstrap pinned dependencies
        run: |
          ./scripts/unix/bootstrap-oscar.sh
          ./scripts/unix/setup-qt.sh
      - name: Build and check Debian package
        run: ./scripts/unix/linux-release.sh
      - uses: actions/upload-artifact@v6
        with:
          name: linux-release
          path: dist/linux/release/*.deb
          if-no-files-found: error
  ubuntu-install:
    needs: ubuntu-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: linux-release
          path: release
      - name: Create user configuration preservation fixture
        run: |
          mkdir -p "$HOME/oscar-ui-test-config"
          cp src/test/resources/simple-docsis.txt "$HOME/oscar-ui-test-config/configuration.txt"
      - name: Install and launch the packaged application
        run: |
          sudo apt-get update
          sudo apt-get install -y ./release/*.deb xvfb xauth
          env -u JAVA_HOME -u QT_PLUGIN_PATH -u LD_LIBRARY_PATH QT_QPA_PLATFORM=xcb \
            xvfb-run -a timeout 40s '/opt/oscar-ui/bin/OSCAR-UI' \
            --smoke-test "$PWD/src/test/resources/simple-docsis.txt" | tee smoke.log
          grep -q 'UI_SMOKE_OK' smoke.log
          dpkg-query -L oscar-ui | while IFS= read -r entry; do
            if [ -f "$entry" ] || [ -L "$entry" ]; then
              printf '%s\n' "$entry"
            fi
          done > installed-files.txt
          test -s installed-files.txt
          grep -q '\.desktop$' installed-files.txt
          desktop_entry=/opt/oscar-ui/lib/oscar-ui-OSCAR-UI.desktop
          grep -qx 'Name=OSCAR-UI' "$desktop_entry"
          grep -qx 'StartupWMClass=OSCAR-UI' "$desktop_entry"
          cmp "$desktop_entry" /usr/share/applications/oscar-ui-OSCAR-UI.desktop
      - name: Exercise verified in-app upgrade helper
        run: |
          package=$(realpath release/*.deb)
          version=$(dpkg-deb -f "$package" Version)
          app_version=${version%-1}
          mkdir upgrade-fixture
          dpkg-deb -R "$package" upgrade-fixture
          sed -i "s/^Version:.*/Version: ${version}~upgrade-test/" upgrade-fixture/DEBIAN/control
          dpkg-deb --root-owner-group -Znone --build upgrade-fixture previous.deb
          sudo apt-get install -y --allow-downgrades ./previous.deb
          digest=$(sha256sum "$package" | cut -d ' ' -f 1)
          sudo /usr/bin/python3 -I /opt/oscar-ui/lib/app/ubuntu-update.py \
            --install "$package" "$app_version" "$digest"
          test "$(dpkg-query -W -f='${Version}' oscar-ui)" = "$version"
          cmp src/test/resources/simple-docsis.txt "$HOME/oscar-ui-test-config/configuration.txt"
          if sudo /usr/bin/python3 -I /opt/oscar-ui/lib/app/ubuntu-update.py \
              --install "$package" "$app_version" "$digest"; then
            echo 'Updater must reject a reinstall or downgrade' >&2
            exit 1
          fi
          env -u JAVA_HOME -u QT_PLUGIN_PATH -u LD_LIBRARY_PATH QT_QPA_PLATFORM=xcb \
            xvfb-run -a timeout 40s /opt/oscar-ui/bin/OSCAR-UI \
            --smoke-test "$PWD/src/test/resources/simple-docsis.txt" | tee upgrade-smoke.log
          grep -q UI_SMOKE_OK upgrade-smoke.log
      - name: Remove package and verify cleanup
        if: always()
        run: |
          if dpkg-query -W oscar-ui >/dev/null 2>&1; then
            sudo apt-get remove -y oscar-ui
          fi
          test "$(dpkg-query -W -f='${Status}' oscar-ui 2>/dev/null || true)" != 'install ok installed'
          test ! -e /opt/oscar-ui/bin/OSCAR-UI
          test ! -e /usr/share/applications/oscar-ui-OSCAR-UI.desktop
          if [ -f installed-files.txt ]; then
            while IFS= read -r entry; do
              test ! -e "$entry" && test ! -L "$entry"
            done < installed-files.txt
          fi
          cmp src/test/resources/simple-docsis.txt "$HOME/oscar-ui-test-config/configuration.txt"
  ubuntu-upload:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-install, ubuntu-install, macos-build]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-desktop-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: linux-release
          path: release
      - name: Attach application to the shared draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "OSCAR-UI $RELEASE_TAG" \
              --notes-file packaging/release-notes.md
          fi
          assets=(release/*.deb)
          test "${#assets[@]}" -eq 1
          test -f "${assets[0]}"
          gh release upload "$RELEASE_TAG" "${assets[0]}" --clobber

  macos-build:
    needs: ci
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.10+7.0.LTS'
          architecture: aarch64
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Bootstrap OSCAR
        run: bash scripts/unix/bootstrap-oscar.sh
      - name: Set up Qt for macOS
        run: bash scripts/macos/setup-qt.sh
      - name: Build and verify experimental DMG
        run: python3 scripts/build/build-image.py --macos
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-package-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        with:
          name: macos-release
          path: dist/macos/release/*.dmg
          if-no-files-found: error

  publish:
    name: Publish verified release
    needs: [windows-upload, ubuntu-upload, macos-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: macos-release
          path: macos-release
      - name: Verify installers and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # The tag endpoint does not resolve drafts. Find the draft's numeric ID.
          release_id=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          [[ "$release_id" =~ ^[0-9]+$ ]] || { echo "Expected one release for $RELEASE_TAG" >&2; exit 1; }
          gh api "repos/$GH_REPO/releases/$release_id" > release-assets.json
          jq -e --arg msi "OSCAR-UI-${version}-windows-x64.msi" \
            --arg deb "oscar-ui_amd64.deb" '
            .assets as $assets |
            all([$msi, $deb][]; . as $name |
              any($assets[]; .name == $name and .state == "uploaded" and .size > 0))
          ' release-assets.json
          gh release download "$RELEASE_TAG" --pattern windows-update.json --dir windows-metadata
          python3 scripts/build/verify-windows-release.py --version "$version" \
            --assets release-assets.json --manifest windows-metadata/windows-update.json
          dmg="macos-release/OSCAR-UI-${version}-macos-arm64.dmg"
          test -s "$dmg"
          gh release upload "$RELEASE_TAG" "$dmg" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
