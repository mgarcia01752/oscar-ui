name: Windows patch prototype
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-patch-prototype-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prototype:
    # The reusable release workflow declares a publishing job, but its explicit
    # patch_prototype guard prevents that job from running, including on tags.
    permissions:
      contents: write
    uses: ./.github/workflows/windows-release.yml
    with:
      patch_prototype: true
