name: Ubuntu release
on:
  workflow_call:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.10+7.0.LTS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot libgl1 libegl1 libdbus-1-3 libfontconfig1 libfreetype6 libx11-xcb1 libxkbcommon0 libxkbcommon-x11-0 libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1 libxcb-render0
      - name: Bootstrap pinned dependencies
        run: |
          ./scripts/unix/bootstrap-oscar.sh
          ./scripts/unix/setup-qt.sh
      - name: Build and check Debian package
        run: ./scripts/unix/linux-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/linux/release/*.deb
          if-no-files-found: error
  linux-install:
    needs: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release
      - name: Create user configuration preservation fixture
        run: |
          mkdir -p "$HOME/oscar-ui-test-config"
          cp src/test/resources/simple-docsis.txt "$HOME/oscar-ui-test-config/configuration.txt"
      - name: Install and launch the packaged application
        run: |
          sudo apt-get update
          sudo apt-get install -y ./release/*.deb xvfb xauth
          env -u JAVA_HOME -u QT_PLUGIN_PATH -u LD_LIBRARY_PATH QT_QPA_PLATFORM=xcb \
            xvfb-run -a timeout 40s '/opt/oscar-ui/bin/OSCAR-UI' \
            --smoke-test "$PWD/src/test/resources/simple-docsis.txt" | tee smoke.log
          grep -q 'UI_SMOKE_OK' smoke.log
          dpkg-query -L oscar-ui | while IFS= read -r entry; do
            if [ -f "$entry" ] || [ -L "$entry" ]; then
              printf '%s\n' "$entry"
            fi
          done > installed-files.txt
          test -s installed-files.txt
          grep -q '\.desktop$' installed-files.txt
          desktop_entry=/opt/oscar-ui/lib/oscar-ui-OSCAR-UI.desktop
          grep -qx 'Name=OSCAR-UI' "$desktop_entry"
          grep -qx 'StartupWMClass=OSCAR-UI' "$desktop_entry"
          cmp "$desktop_entry" /usr/share/applications/oscar-ui-OSCAR-UI.desktop
      - name: Exercise verified in-app upgrade helper
        run: |
          package=$(realpath release/*.deb)
          version=$(dpkg-deb -f "$package" Version)
          app_version=${version%-1}
          mkdir upgrade-fixture
          dpkg-deb -R "$package" upgrade-fixture
          sed -i "s/^Version:.*/Version: ${version}~upgrade-test/" upgrade-fixture/DEBIAN/control
          dpkg-deb --root-owner-group -Znone --build upgrade-fixture previous.deb
          sudo apt-get install -y --allow-downgrades ./previous.deb
          digest=$(sha256sum "$package" | cut -d ' ' -f 1)
          sudo /usr/bin/python3 -I /opt/oscar-ui/lib/app/ubuntu-update.py \
            --install "$package" "$app_version" "$digest"
          test "$(dpkg-query -W -f='${Version}' oscar-ui)" = "$version"
          cmp src/test/resources/simple-docsis.txt "$HOME/oscar-ui-test-config/configuration.txt"
          if sudo /usr/bin/python3 -I /opt/oscar-ui/lib/app/ubuntu-update.py \
              --install "$package" "$app_version" "$digest"; then
            echo 'Updater must reject a reinstall or downgrade' >&2
            exit 1
          fi
          env -u JAVA_HOME -u QT_PLUGIN_PATH -u LD_LIBRARY_PATH QT_QPA_PLATFORM=xcb \
            xvfb-run -a timeout 40s /opt/oscar-ui/bin/OSCAR-UI \
            --smoke-test "$PWD/src/test/resources/simple-docsis.txt" | tee upgrade-smoke.log
          grep -q UI_SMOKE_OK upgrade-smoke.log
      - name: Remove package and verify cleanup
        if: always()
        run: |
          sudo apt-get remove -y oscar-ui
          test "$(dpkg-query -W -f='${Status}' oscar-ui 2>/dev/null || true)" != 'install ok installed'
          test ! -e /opt/oscar-ui/bin/OSCAR-UI
          test ! -e /usr/share/applications/oscar-ui-OSCAR-UI.desktop
          if [ -f installed-files.txt ]; then
            while IFS= read -r entry; do
              test ! -e "$entry" && test ! -L "$entry"
            done < installed-files.txt
          fi
          cmp src/test/resources/simple-docsis.txt "$HOME/oscar-ui-test-config/configuration.txt"
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: linux-install
    runs-on: ubuntu-latest
    concurrency:
      group: publish-desktop-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release
      - name: Attach application to the shared draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "OSCAR-UI $RELEASE_TAG" \
              --notes-file packaging/release-notes.md
          fi
          assets=(release/*.deb)
          test "${#assets[@]}" -eq 1
          test -f "${assets[0]}"
          gh release upload "$RELEASE_TAG" "${assets[0]}" --clobber
